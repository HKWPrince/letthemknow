spring:
  application:
    name: letthemknow-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/letthemknow?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USER:letthemknow}
    password: ${DB_PASSWORD:LetThemKnow_Str0ng!Pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        timezone:
          # MySQL has no timezone-aware column type, so OffsetDateTime is normalised to UTC and stored
          # in a plain DATETIME(6). Without this the JVM's zone would leak into the stored value.
          default_storage: NORMALIZE_UTC
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  autoconfigure:
    # Phase 1 replaces this with a real UserDetailsService; suppress the generated dev password until then.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/docs/openapi
  swagger-ui:
    path: /api/docs

ltk:
  security:
    master-key: ${LTK_MASTER_KEY:}
    jwt-secret: ${LTK_JWT_SECRET:}
    jwt-ttl: 12h
    # Shared code for self-service tenant creation. Unset means signup is DISABLED, not open.
    signup-code: ${LTK_SIGNUP_CODE:}
  worker:
    enabled: ${APP_WORKER_ENABLED:true}
  integration:
    rate-limit-per-minute: 60
  dispatch:
    # Namespace for stream / queue keys; change it to share one Redis between environments.
    key-prefix: ltk
    email-chunk-size: 50
    line-chunk-size: 500
    max-attempts: 3
    retry-base: 30s
    reaper-idle: 5m
    consumers-per-stream: 1
    reaper-interval-ms: 60000
    narrowcast-poll-ms: 30000
    schedule-sweep-ms: 60000

logging:
  level:
    root: INFO
    io.letthemknow: INFO
