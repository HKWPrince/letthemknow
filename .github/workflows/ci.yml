name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify (unit + Testcontainers integration tests)
        working-directory: api
        run: ./mvnw -B -ntp verify

  web:
    name: Web (pnpm build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      # web/public/PRD.html has to be committed because the image is built with ./web as its context,
      # so the root copy is invisible to Docker. Two copies can drift, and a stale one would be served
      # silently, so fail here instead: edit PRD.html, run pnpm build, commit both.
      - name: PRD copy is in sync with the source
        run: |
          if ! diff -q PRD.html web/public/PRD.html >/dev/null; then
            echo "::error::web/public/PRD.html differs from PRD.html. Run 'pnpm build' in web/ and commit both."
            diff --unified=1 PRD.html web/public/PRD.html | head -20
            exit 1
          fi
          echo "PRD.html and web/public/PRD.html are identical"

      - name: Build
        working-directory: web
        run: pnpm build
